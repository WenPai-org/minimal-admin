name: Publish release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: linux-arm64
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate and build reproducible package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          }
          python3 tools/build_language_packs.py --root "$GITHUB_WORKSPACE"
          python3 tools/build_release.py --root "$GITHUB_WORKSPACE"
          ZIP="$GITHUB_WORKSPACE/dist/minimal-admin-$VERSION.zip"
          python3 tools/verify_release.py --root "$GITHUB_WORKSPACE" --zip "$ZIP"
          for LOCALE in zh_CN zh_TW; do
            STATUS="$GITHUB_WORKSPACE/docs/$LOCALE/translation-status.json"
            if [ ! -f "$STATUS" ]; then
              echo "::warning::No documentation translation status found for $LOCALE; publishing with source-language fallback"
              continue
            fi
            if ! VALUES=$(jq -er '[.translated, .total] | select(all(.[]; type == "number")) | @tsv' "$STATUS" 2>/dev/null); then
              echo "::warning::Invalid documentation translation status for $LOCALE; publishing with source-language fallback"
              continue
            fi
            IFS=$'\t' read -r TRANSLATED TOTAL <<< "$VALUES"
            if [ "$TRANSLATED" != "$TOTAL" ]; then
              echo "::warning::Documentation translation is incomplete for $LOCALE ($TRANSLATED/$TOTAL); publishing available translations"
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$ZIP.sha256" >> "$GITHUB_OUTPUT"

      - name: Smoke test release ZIP in WordPress Playground
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          ZIP="${{ steps.build.outputs.zip }}"
          cp "$ZIP" "$RUNNER_TEMP/"
          for LOCALE in zh_CN zh_TW; do
            PACK="$GITHUB_WORKSPACE/dist/languages/minimal-admin-$LOCALE.zip"
            PACK_ARGS=()
            if [ -f "$PACK" ]; then
              cp "$PACK" "$RUNNER_TEMP/"
              PACK_ARGS=( --language-pack-path "$(basename "$PACK")" )
            else
              echo "::warning::No language pack built for $LOCALE; testing source-language fallback"
            fi
            python3 tools/create_playground_blueprint.py \
              --plugin-path "$(basename "$ZIP")" \
              --version "$VERSION" --locale "$LOCALE" \
              "${PACK_ARGS[@]}" \
              --output "$RUNNER_TEMP/playground-$LOCALE.json"
            npx --yes @wp-playground/cli@3.1.48 run-blueprint \
              --blueprint="$RUNNER_TEMP/playground-$LOCALE.json" \
              --blueprint-may-read-adjacent-files --verbosity=normal
          done

      - name: Create FeiCode release and upload assets
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_TOKEN" ] || { echo "RELEASE_TOKEN is missing" >&2; exit 1; }
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          ZIP="${{ steps.build.outputs.zip }}"
          CHECKSUM="${{ steps.build.outputs.checksum }}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token $RELEASE_TOKEN"
          UPSTREAM_TAG=$(jq -r .upstream_tag upstream-lock.json)
          UPSTREAM_COMMIT=$(jq -r .upstream_commit upstream-lock.json)
          SHA256=$(awk '{print $1}' "$CHECKSUM")
          NOTES=$(printf 'Minimal Admin %s\n\nRenamed from upstream %s at `%s`.\n\nSHA-256: `%s`\n' \
            "$VERSION" "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" "$SHA256")
          STATUS=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "$AUTH" "$API/releases/tags/$TAG")
          if [ "$STATUS" = 404 ]; then
            jq -nc --arg tag "$TAG" --arg name "Minimal Admin $VERSION" --arg body "$NOTES" \
              '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' \
              > "$RUNNER_TEMP/release-body.json"
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/release-body.json" "$API/releases" \
              > "$RUNNER_TEMP/release.json"
          elif [ "$STATUS" != 200 ]; then
            cat "$RUNNER_TEMP/release.json" >&2
            exit 1
          fi
          RELEASE_ID=$(jq -r .id "$RUNNER_TEMP/release.json")
          FILES=( "$ZIP" "$CHECKSUM" )
          while IFS= read -r FILE; do FILES+=( "$FILE" ); done \
            < <(find "$GITHUB_WORKSPACE/dist/languages" -maxdepth 1 -type f \
              \( -name 'minimal-admin-*.zip' -o -name 'minimal-admin-*.zip.sha256' \) | sort)
          for FILE in "${FILES[@]}"; do
            NAME=$(basename "$FILE")
            ENCODED=$(printf '%s' "$NAME" | jq -sRr @uri)
            EXISTING=$(jq -r --arg name "$NAME" '.assets[]? | select(.name == $name) | .browser_download_url' \
              "$RUNNER_TEMP/release.json" | head -1)
            if [ -n "$EXISTING" ]; then
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/existing-$NAME" "$EXISTING"
              LOCAL_SHA=$(sha256sum "$FILE" | awk '{print $1}')
              REMOTE_SHA=$(sha256sum "$RUNNER_TEMP/existing-$NAME" | awk '{print $1}')
              [ "$LOCAL_SHA" = "$REMOTE_SHA" ] || {
                echo "Existing immutable release asset differs: $NAME" >&2
                exit 1
              }
              echo "Existing release asset already matches: $NAME"
              continue
            fi
            curl -fsS --retry 3 --retry-all-errors -X POST -H "$AUTH" \
              -F "attachment=@$FILE" "$API/releases/$RELEASE_ID/assets?name=$ENCODED" >/dev/null
          done

      - name: Verify public assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          BASE="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NAME="minimal-admin-$VERSION.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME" "$BASE/$NAME"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME.sha256" "$BASE/$NAME.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$NAME.sha256")
          while IFS= read -r CHECKSUM; do
            PACK=$(basename "${CHECKSUM%.sha256}")
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$PACK" "$BASE/$PACK"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$PACK.sha256" "$BASE/$PACK.sha256"
            (cd "$RUNNER_TEMP" && sha256sum -c "$PACK.sha256")
          done < <(find "$GITHUB_WORKSPACE/dist/languages" -maxdepth 1 -type f \
            -name 'minimal-admin-*.zip.sha256' | sort)
