name: Publish release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: linux-arm64
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and build reproducible package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          }
          python3 tools/build_release.py --root "$GITHUB_WORKSPACE"
          ZIP="$GITHUB_WORKSPACE/dist/minimal-admin-$VERSION.zip"
          python3 tools/verify_release.py --root "$GITHUB_WORKSPACE" --zip "$ZIP"
          for LOCALE in zh_CN zh_TW; do
            STATUS="$GITHUB_WORKSPACE/docs/$LOCALE/translation-status.json"
            [ "$(jq -r .translated "$STATUS")" = "$(jq -r .total "$STATUS")" ] || {
              echo "Localized documentation is incomplete for $LOCALE" >&2
              exit 1
            }
            unzip -Z1 "$ZIP" | grep -q "^minimal-admin/docs/$LOCALE/user-guide.md$"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$ZIP.sha256" >> "$GITHUB_OUTPUT"

      - name: Smoke test release ZIP in WordPress Playground
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          ZIP="${{ steps.build.outputs.zip }}"
          PORT=8123
          python3 -m http.server "$PORT" --bind 127.0.0.1 \
            --directory "$(dirname "$ZIP")" >"$RUNNER_TEMP/playground-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:$PORT/$(basename "$ZIP")" && break
            sleep 0.25
          done
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/$(basename "$ZIP")"
          for LOCALE in zh_CN zh_TW; do
            python3 tools/create_playground_blueprint.py \
              --plugin-url "http://127.0.0.1:$PORT/$(basename "$ZIP")" \
              --version "$VERSION" --locale "$LOCALE" \
              --output "$RUNNER_TEMP/playground-$LOCALE.json"
            npx --yes @wp-playground/cli@3.1.48 run-blueprint \
              --blueprint="$RUNNER_TEMP/playground-$LOCALE.json" --verbosity=normal
          done

      - name: Create FeiCode release and upload assets
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_TOKEN" ] || { echo "RELEASE_TOKEN is missing" >&2; exit 1; }
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          ZIP="${{ steps.build.outputs.zip }}"
          CHECKSUM="${{ steps.build.outputs.checksum }}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token $RELEASE_TOKEN"
          UPSTREAM_TAG=$(jq -r .upstream_tag upstream-lock.json)
          UPSTREAM_COMMIT=$(jq -r .upstream_commit upstream-lock.json)
          SHA256=$(awk '{print $1}' "$CHECKSUM")
          NOTES=$(printf 'Minimal Admin %s\n\nRenamed from upstream %s at `%s`.\n\nSHA-256: `%s`\n' \
            "$VERSION" "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" "$SHA256")
          STATUS=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "$AUTH" "$API/releases/tags/$TAG")
          if [ "$STATUS" = 404 ]; then
            jq -nc --arg tag "$TAG" --arg name "Minimal Admin $VERSION" --arg body "$NOTES" \
              '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' \
              > "$RUNNER_TEMP/release-body.json"
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/release-body.json" "$API/releases" \
              > "$RUNNER_TEMP/release.json"
          elif [ "$STATUS" != 200 ]; then
            cat "$RUNNER_TEMP/release.json" >&2
            exit 1
          fi
          RELEASE_ID=$(jq -r .id "$RUNNER_TEMP/release.json")
          for FILE in "$ZIP" "$CHECKSUM"; do
            NAME=$(basename "$FILE")
            ENCODED=$(printf '%s' "$NAME" | jq -sRr @uri)
            curl -fsS --retry 3 --retry-all-errors -X POST -H "$AUTH" \
              -F "attachment=@$FILE" "$API/releases/$RELEASE_ID/assets?name=$ENCODED" >/dev/null
          done

      - name: Verify public assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          BASE="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NAME="minimal-admin-$VERSION.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME" "$BASE/$NAME"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME.sha256" "$BASE/$NAME.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$NAME.sha256")
